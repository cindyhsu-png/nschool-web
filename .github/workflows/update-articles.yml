name: Update latest articles

# 每天台灣時間 08:00（UTC 00:00）自動抓最新文章；也可手動觸發
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Playwright 版本要釘住。之前寫 `npm install -D playwright` 沒釘版本，
      # 等於每天抓一個可能換掉預設行為的新版 —— 這類無聲漂移很難事後追。
      - name: Install Playwright
        run: |
          npm install -D playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Fetch latest articles
        run: node scripts/fetch-articles.mjs

      # 失敗時把 runner 實際看到的頁面存起來，下次不必再瞎猜
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blog-render-debug
          path: playwright-debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit if changed
        run: |
          if git diff --quiet -- articles.json; then
            echo "No change in articles.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add articles.json
            git commit -m "chore: refresh latest articles"
            git push
          fi
