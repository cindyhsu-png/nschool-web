name: Update latest articles

# 每天台灣時間 08:00（UTC 00:00）自動抓最新文章；也可手動觸發
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install --with-deps chromium

      - name: Fetch latest articles
        run: node scripts/fetch-articles.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- articles.json; then
            echo "No change in articles.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add articles.json
            git commit -m "chore: refresh latest articles"
            git push
          fi
