name: Update latest articles

# 每天從 Kolable 的 GraphQL 抓 nschool 最新 4 篇已發布文章，更新 articles.json。
#
# 2026-10-06 恢復每日排程。原本是用無頭瀏覽器渲染 nschool.tw/blog，
# 但 nschool.tw 擋掉 GitHub Actions 的機房 IP（6 月中起每天 403），
# 改成直接查 Kolable 的 GraphQL（scripts/fetch-articles.mjs），不再經過 nschool.tw。
#
# 需要兩個 repo secrets（Settings → Secrets and variables → Actions）：
#   KOLABLE_CLIENT_ID、KOLABLE_CLIENT_KEY（nschool 品牌）
# 這個 repo 是 public：不要在任何步驟把它們或換來的 token 印出來。
on:
  schedule:
    - cron: "0 0 * * *"   # 每天台灣時間 08:00（UTC 00:00）
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # 用來叫起 deploy.yml，見最後一步

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 腳本只用 Node 內建的 fetch，不需要 npm install
      - name: Fetch latest articles
        env:
          KOLABLE_CLIENT_ID: ${{ secrets.KOLABLE_CLIENT_ID }}
          KOLABLE_CLIENT_KEY: ${{ secrets.KOLABLE_CLIENT_KEY }}
        run: node scripts/fetch-articles.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- articles.json; then
            echo "No change in articles.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add articles.json
            git commit -m "chore: refresh latest articles"
            git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi

      # 用 GITHUB_TOKEN push 的 commit 不會觸發其他 workflow（GitHub 的規則，防無限迴圈），
      # 所以 deploy.yml 的 on: push 不會跑、網站不會更新。要明確叫它一次。
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
